name: MTG sale alerts

# Sends each due alert exactly once as a GitHub issue (GitHub emails the owner), and a roundup on Sundays.
# Runs daily, and whenever the registry changes on main so a newly verified sale goes out right away.
on:
  schedule:
    - cron: "7 14 * * *"      # 8:07 AM Central in winter (9:07 AM during daylight time)
  push:
    branches: [main]
    paths: ["registry/**", "config/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be sent without opening issues"
        type: boolean
        default: false
      roundup:
        description: "Weekly roundup: auto (Sundays), force, or skip"
        type: choice
        options: [auto, force, skip]
        default: auto

permissions:
  contents: read
  issues: write

# One alert run at a time, never cancelled midway: the issue ledger must not be read by two runs at once.
concurrency:
  group: mtg-sale-alerts
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: requirements-lock.txt

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Send due alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ROUNDUP: ${{ inputs.roundup || 'auto' }}
        run: python -m mtg_retail.cli notify $DRY_RUN --roundup "$ROUNDUP"
      - run: python -m mtg_retail.cli export --out output
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-retail-export-${{ github.run_id }}
          path: output/
