name: MTG sale alerts

# Daily: refresh the store lists (weekly), read every store's own page for sales, commit what changed in
# registry/auto/, then send each due alert exactly once as a GitHub issue (GitHub emails the owner), and a
# roundup on Sundays. Also runs whenever the registry, config or collector code changes on main.
on:
  schedule:
    - cron: "7 14 * * *"      # 8:07 AM Central in winter (9:07 AM during daylight time)
  push:
    branches: [main]
    paths: ["registry/**", "config/**", "src/**", ".github/workflows/daily-alerts.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be sent without opening issues"
        type: boolean
        default: false
      rediscover:
        description: "Refresh the store lists now (normally weekly)"
        type: boolean
        default: false
      roundup:
        description: "Weekly roundup: auto (Sundays), force, or skip"
        type: choice
        options: [auto, force, skip]
        default: auto

permissions:
  contents: write     # commits registry/auto/ (store lists, page checks, detections)
  issues: write

# One alert run at a time, never cancelled midway: the issue ledger must not be read by two runs at once.
concurrency:
  group: mtg-sale-alerts
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: requirements-lock.txt

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Refresh the store lists (weekly)
        run: python -m mtg_retail.cli discover ${{ inputs.rediscover && '--force' || '' }}
      - name: Check stores' pages for sales
        run: python -m mtg_retail.cli watch
      - name: Save what changed
        if: ${{ !inputs.dry_run }}
        run: scripts/commit_paths.sh "Store lists and page checks $(date -u +%F)" registry/auto
      - name: Send due alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          ROUNDUP: ${{ inputs.roundup || 'auto' }}
        run: python -m mtg_retail.cli notify $DRY_RUN --roundup "$ROUNDUP"
      - name: Rebuild the sales board (board/README.md and maps)
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m mtg_retail.cli board
          scripts/commit_paths.sh "Sales board $(date -u +%F)" board
      - run: python -m mtg_retail.cli export --out output
      - uses: actions/upload-artifact@v7
        with:
          name: mtg-retail-export-${{ github.run_id }}
          path: output/
